# YOLO26 four-task independent LaneRobotV2 model with P4+P5 multi-scale fusion.
# The lane head keeps the YOLOP/UFLD row-anchor form and upgrades it with:
# P4+P5 fusion, soft-label compatible cls logits, and sub-grid offset regression.
# Output: {cls: [B, x_grids + 1, row_anchors, num_lanes], offset: [B, 1, row_anchors, num_lanes]}. Default x_grids=160; x is recovered to pixels by x / (x_grids - 1) * (image_width - 1).

# Parameters
nc: 4
task: lane
x_grids: 160
row_anchors: 56
num_lanes: 4
reduce_channels: 8
hidden_dim: 512
feat_h: 8
feat_w: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10, stride-32 deep feature, analogous to /model.9/cv4/act/Div_output_0

head:
  # P5 / stride-32 semantic feature reduction
  - [10, 1, Conv, [256, 1, 1]] # 11
  # Upsample P5 to P4 scale
  - [-1, 1, nn.Upsample, [None, 2, nearest]] # 12
  # P4 / stride-16 spatial feature reduction
  - [6, 1, Conv, [256, 1, 1]] # 13
  # P4 + P5 multi-scale fusion
  - [[-1, -2], 1, Concat, [1]] # 14
  - [-1, 1, Conv, [512, 3, 1]] # 15
  # Four independent UFLD-v2-like lane branches: cls [B, X+1, R, L] + offset [B, 1, R, L]
  - [-1, 1, LaneRobotV2Independent, [x_grids, row_anchors, num_lanes, reduce_channels, hidden_dim, feat_h, feat_w]] # 16
