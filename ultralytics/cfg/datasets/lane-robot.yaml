# LaneRobot row-anchor dataset template
# Label format per line:
#   lane_id x1 y1 x2 y2 ... x56 y56
# x is normalized [0,1]; x=-1 means absent/no-lane. y is normalized [0,1].
# Default label path follows images/... -> labels/... with the same basename and .txt suffix.

path: /home/xhm/Desktop/ULTRALYTICS_LANE_ROBOT/datasets
train: images/train
val: images/valid

# Optional explicit label roots. Remove these to use images/... -> labels/... convention.
train_labels: labels_corrected/train
val_labels: labels_corrected/valid

x_grids: 160
row_anchors: 56
num_lanes: 4
y_start: 0.333333
y_end: 1.0
# 保持原图宽高比，不足区域补黑边
letterbox: false

# RGB 黑色
letterbox_color: [0, 0, 0]

# 纵向不足时，黑边只补在顶部，保持图像底部对齐
letterbox_bottom_align: false
channels: 3
nc: 4
names:
  0: lane_follow
  1: lead_lane
  2: channel_left
  3: channel_right

# Horizontal-flip lane-slot mapping:
# channel_left (2) <-> channel_right (3)
flip_lane_pairs:
  - [2, 3]
